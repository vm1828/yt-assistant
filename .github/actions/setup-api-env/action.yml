name: "Setup `yt_assistant_api` Environment"
description: "Set up Python, venv, and install dependencies for yt_assistant_api"

runs:
  using: "composite"
  steps:
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-api-${{ hashFiles('yt_assistant_api/requirements*.txt') }}
        restore-keys: ${{ runner.os }}-pip-api-

    - name: Install dependencies
      run: |
        cd yt_assistant_api
        python3 -m venv .venv
        .venv/bin/python -m pip install --upgrade pip setuptools wheel
        .venv/bin/python -m pip install -r requirements.txt -r requirements-dev.txt
        .venv/bin/python -m pip install torch==2.9.0+cpu --index-url https://download.pytorch.org/whl/cpu
        .venv/bin/python -m pip install sentence-transformers==5.1.2
      shell: bash

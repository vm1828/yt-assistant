name: Setup yt_assistant_emb Environment

runs:
  using: "composite"
  steps:
    # ---------------------- Set up Python ----------------------
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    # ---------------------- Install dev dependencies ----------------------
    - name: Install dev dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r yt_assistant_emb/requirements-dev.txt
      shell: bash
